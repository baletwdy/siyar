<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سِيَر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column (max 560px) with a fixed bottom bar; each screen is a stack of manuscript-like panels. */
:root {
  --bg: #0D1A18;
  --surface: #142623;
  --surface-2: #1B322E;
  --line: #2A4641;
  --fg: #EFE7D3;
  --muted: #A6B7AF;
  --faint: #8A9F96;
  --gold: #E0AE4E;
  --teal: #5FB3A6;
  --on-gold: #10201D;
  --c-hanafi: #E0AE4E;
  --c-maliki: #5FB3A6;
  --c-shafii: #E58C6B;
  --c-hanbali: #A99CE6;
  --font-display: "Amiri", "Traditional Arabic", "Times New Roman", serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F1F3EE; --surface: #FFFFFF; --surface-2: #E5EBE5; --line: #C9D5CD;
    --fg: #14211E; --muted: #4B5E57; --faint: #5A6C64;
    --gold: #8F600C; --teal: #1C6B60; --on-gold: #FFFFFF;
    --c-hanafi: #8F600C; --c-maliki: #1C6B60; --c-shafii: #A8461F; --c-hanbali: #5B4BB5;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F1F3EE; --surface: #FFFFFF; --surface-2: #E5EBE5; --line: #C9D5CD;
  --fg: #14211E; --muted: #4B5E57; --faint: #5A6C64;
  --gold: #8F600C; --teal: #1C6B60; --on-gold: #FFFFFF;
  --c-hanafi: #8F600C; --c-maliki: #1C6B60; --c-shafii: #A8461F; --c-hanbali: #5B4BB5;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.75; }
* { box-sizing: border-box; }
button { font-family: inherit; font-size: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
p { margin: 0; }
.display { font-family: var(--font-display); }
.ref { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--teal); letter-spacing: .02em; }
.muted { color: var(--muted); }

.topbar { display: flex; align-items: center; gap: 12px; }
.icon-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 22px; height: 22px; }
.title-block { display: flex; flex-direction: column; min-width: 0; }
.title-block h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.25; }
.title-block .sub { font-size: 13px; color: var(--muted); }

.brand { display: flex; align-items: center; justify-content: center; text-align: center; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-size: 48px; line-height: 1; color: var(--gold); }
.brand .tag { font-size: 14px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.quiet { background: transparent; border-style: dashed; }
.panel h2 { font-size: 15px; font-weight: 600; color: var(--teal); }

.imam-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.imam-card { text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; position: relative; min-height: 150px; }
.imam-card .letter { font-family: var(--font-display); font-size: 44px; line-height: 1; color: var(--ic); }
.imam-card .name { font-weight: 600; font-size: 16px; line-height: 1.4; }
.imam-card .yrs { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.imam-card .school { font-size: 12px; color: var(--ic); font-weight: 600; }
.imam-card .stamp { position: absolute; top: 12px; left: 12px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ic); display: grid; place-items: center; color: var(--ic); }
.imam-card .stamp svg { width: 16px; height: 16px; }

.collection { text-align: start; cursor: pointer; border: 1px solid var(--gold); background: var(--surface); border-radius: 22px; padding: 22px 20px; display: flex; flex-direction: column; gap: 6px; }
.collection .ctitle { font-family: var(--font-display); font-size: 32px; line-height: 1.25; color: var(--gold); font-weight: 700; }
.collection .letters { display: flex; gap: 8px; margin-top: 8px; }
.collection .letters i { font-style: normal; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ic); color: var(--ic); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: start; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile svg { width: 22px; height: 22px; color: var(--teal); }
.tile b { font-size: 14px; }
.tile span { font-size: 12px; color: var(--muted); line-height: 1.5; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); font-weight: 600; }

.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tab { min-height: 42px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-weight: 600; font-size: 13px; padding: 0 2px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface-2); color: var(--fg); }

.hero { border-radius: 20px; padding: 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.hero .nm { font-family: var(--font-display); font-size: 30px; line-height: 1.3; color: var(--ic); }
.hero .yrs { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

.fact { display: flex; flex-direction: column; gap: 2px; }
.place { display: flex; gap: 10px; }
.place .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 9px; background: var(--ic); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.tier { margin-top: 18px; } .tier h3 { margin: 0 0 6px; font-size: 16px; } .tier h3 small { font-weight: 400; font-size: 12px; color: var(--muted, #888); margin-inline-start: 6px; }
.cent { margin: 10px 0 0; } .cent h4 { margin: 0 0 8px; font-size: 13px; opacity: .8; border-bottom: 1px dashed currentColor; padding-bottom: 4px; }
.pill { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 14px; background: var(--surface-2); line-height: 1.5; }
.pill b { font-weight: 500; font-size: 14px; }
.pill.tap { border: 1px solid var(--line); cursor: pointer; text-align: start; min-height: 44px; color: inherit; font: inherit; }
.pill.tap .more { font-size: 12px; color: var(--ic, var(--muted)); }
.pill.work { background: transparent; border: 1px solid var(--ic); }
.pill.work b { color: var(--ic); font-weight: 600; }
.quote { font-family: var(--font-display); font-size: 21px; line-height: 1.8; }

.story { border-radius: 22px; padding: 24px 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; min-height: 320px; }
.story .kicker { font-size: 13px; font-weight: 600; color: var(--ic); }
.story h3 { font-family: var(--font-display); font-size: 30px; line-height: 1.3; color: var(--ic); }
.story p { font-size: 17px; line-height: 1.95; }
.progress { display: flex; gap: 5px; }
.progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.progress span.on { background: var(--ic); }
.row { display: flex; gap: 10px; }
.btn { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; padding: 0 16px; }
.ed { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; line-height: 1.7; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: inherit; min-height: 44px; }
.ed-f { display: flex; flex-direction: column; gap: 4px; }
.ed-line { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn:disabled { opacity: .45; cursor: default; }
.grow { flex: 1; }

.svgwrap { width: 100%; overflow-x: auto; }
svg.map, svg.chain, svg.tl { width: 100%; height: auto; display: block; direction: ltr; }
.map .grid { stroke: var(--line); stroke-width: .6; fill: none; }
.map .gl { fill: var(--faint); font-size: 8px; font-family: var(--font-body); }
.map .city { fill: var(--fg); font-size: 11px; font-family: var(--font-body); font-weight: 600; }
.map .city.dim { fill: var(--faint); font-weight: 400; }
.map .base { fill: var(--surface-2); stroke: var(--line); }
.chain .node { fill: var(--surface-2); stroke: var(--line); }
.chain .lbl { fill: var(--fg); font-size: 13px; font-family: var(--font-body); font-weight: 600; }
.chain .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.chain .elbl { fill: var(--faint); font-size: 9.5px; font-family: var(--font-body); }
.chain .arrow { fill: var(--muted); }
.tl .axis { stroke: var(--line); }
.tl .tick { fill: var(--faint); font-size: 10px; font-family: var(--font-body); }
.tl .nm { fill: var(--fg); font-size: 12px; font-family: var(--font-body); font-weight: 600; }
.tl .yr { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.tl .ev { stroke: var(--gold); stroke-dasharray: 3 3; }
.tl .evt { fill: var(--gold); font-size: 10px; font-family: var(--font-body); }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--ic); display: inline-block; }

.hints { display: flex; flex-direction: column; gap: 8px; }
.hint { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.hint.locked { background: transparent; border: 1px dashed var(--line); color: var(--faint); }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.opt.right { border-color: var(--teal); background: var(--surface-2); color: var(--teal); }
.opt.wrong { border-color: var(--c-shafii); color: var(--c-shafii); }
.score { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--gold); }
.verdict { font-weight: 600; }

.passport { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.seal { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; text-align: center; }
.seal .ring { width: 56px; height: 56px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--font-display); font-size: 24px; color: var(--faint); }
.seal.on .ring { border-style: solid; border-color: var(--ic); color: var(--ic); background: var(--surface-2); }

.navbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
.navbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.collection.alt { border-color: var(--teal); }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.search { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 8px 14px; font: inherit; }
.not-group h3 { font-size: 15px; margin: 4px 0 8px; color: var(--ic, var(--fg)); }
.set-row { display: flex; flex-direction: column; gap: 10px; }
[hidden] { display: none !important; }
.nav { min-height: 64px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; }
.nav svg { width: 22px; height: 22px; }
.nav[aria-current="page"] { color: var(--gold); font-weight: 600; }
.source-note { font-size: 12px; line-height: 1.8; color: var(--faint); }

@media (prefers-reduced-motion: no-preference) {
  .story, .hero, .panel { animation: rise .35s ease both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

<script>

/* ---------- البيانات: كل معلومة مُحالة إلى «سير أعلام النبلاء» (ط الرسالة) بالجزء/الصفحة ---------- */
const IMAMS = [
  {
    id: 'hanafi', short: 'أبو حنيفة', letter: 'ن', school: 'المذهب الحنفي',
    name: 'أبو حنيفة النعمان بن ثابت التيمي', born: 80, died: 150,
    book: { short: 'الجواهر', full: '«الجواهر المضية في طبقات الحنفية» لعبد القادر القرشي (ت ٧٧٥ هـ)، بتحقيق الحلو' },
    years: '٨٠ – ١٥٠ هـ', yearsRef: '٦/٣٩١، ٦/٤٠٣', yearsM: 'الجواهر ١/٥٣–٥٤',
    summary: 'الإمام، فقيه الملة، عالم العراق، الكوفي. كان خزّازًا يبيع الخزّ، ودكّانه معروف في دار عمرو بن حريث.', summaryRef: '٦/٣٩٠، ٦/٣٩٤',
    extra: { t: 'قال القرشي: روى عنه الجمّ الغفير، نحو من أربعة آلاف نفس.', m: 'الجواهر ١/٥٥' },
    sifa: { t: 'قال أبو يوسف: كان ربعة، من أحسن الناس صورة، وأبلغهم نطقًا، وأعذبهم نغمة. وقال ابنه حماد: كان جميلًا تعلوه سمرة، حسن الهيئة، كثير التعطّر، هيوبًا، لا يتكلم إلا جوابًا، ولا يخوض فيما لا يعنيه.', r: '٦/٣٩٩–٤٠٠' },
    places: [
      { k: 'b', city: 'kufa', t: 'بلده، وبها دكّانه، ورُئي شيخًا يفتي الناس بمسجدها', r: '٦/٣٩٤، ٦/٣٩٩' },
      { k: 's', city: 'basra', t: 'قدمها فسُئل عن أشياء لم يكن عنده فيها جواب، فعزم على ملازمة حماد', r: '٦/٣٩٨' },
      { k: 'd', city: 'baghdad', t: 'حُبس فيها لامتناعه عن القضاء، ومات بها', r: '٦/٤٠١، ٦/٤٠٣', m: 'الجواهر ١/٥٤' }
    ],
    teachers: [
      { n: 'حماد بن أبي سليمان', d: 'وبه تفقّه', r: '٦/٣٩١' },
      { n: 'عطاء بن أبي رباح', d: 'أكبر شيخ له', r: '٦/٣٩١', m: 'الجواهر ١/٥٥' },
      { n: 'نافع مولى ابن عمر', d: '', r: '٦/٣٩١', m: 'الجواهر ١/٥٥' }
    ],
    students: [ { n: 'القاضي أبو يوسف', r: '٦/٣٩٤' }, { n: 'محمد بن الحسن الشيباني', r: '٦/٣٩٤' }, { n: 'زفر بن الهذيل', r: '٦/٣٩٣' } ],
    works: [],
    quote: 'ما أحوج الناس كل وقت إلى من يقول لهم مثل هذا', quoteBy: 'الإمام أبو حنيفة لمن قال له: اتّقِ الله', quoteRef: '٦/٤٠٠',
    notes: [
      { t: 'قصة تركه علم الكلام وجلوسه إلى حماد بعد سؤال امرأة عن الطلاق قال فيها الذهبي: «الله أعلم بصحتها». والثابت عنده من رواية العجلي أنه صحب حمادًا ثماني عشرة سنة.', r: '٦/٣٩٧–٣٩٨' },

    ],

      { k: 'الكوفة', h: 'خزّاز الكوفة', p: 'قال العجلي: كان أبو حنيفة خزّازًا يبيع الخزّ، ودكّانه معروف في دار عمرو بن حريث.', r: '٦/٣٩٤' },

      { k: 'شهادة مالك', h: 'سارية من ذهب', p: 'سُئل مالك عن أبي حنيفة فقال: رأيتُ رجلًا لو كلّمك في هذه السارية أن يجعلها ذهبًا لقام بحجّته.', r: '٦/٣٩٩', m: 'الجواهر ١/٥٦' },

    { t: 'سمع هشام بن عروة والأعمش وابن جريج والأوزاعي وسفيان الثوري وشعبة.', r: '٩/١٤٠–١٦٧' },
    { t: 'حدّث عنه الثوري وابن المبارك وابن مهدي والحميدي وأحمد وابن معين وإسحاق.', r: '٩/١٤٠–١٦٧' },
    { t: 'قال يحيى بن أكثم: «صحبته في الحضر والسفر، وكان يصوم الدهر ويختم القرآن كل ليلة».', r: '٩/١٤٢' },
    { t: 'مات يوم عاشوراء سنة ١٩٧ هـ بفَيد راجعًا من الحج، وعاش ٦٨ سنة.', r: '٩/١٦٦' },
    { t: 'ذكره الصيمري فيمن أخذ العلم عن أبي حنيفة.', r: '', m: 'الجواهر ٣/٥٧٦' }
  ], note: 'لم أقرأ ترجمته في «طبقات الحنابلة» (أحال إليها محقق «الجواهر» في ١/٣٩١–٣٩٢)؛ والمقابل الحنفي في «الجواهر» ٣/٥٧٦ سطر واحد.' },

  razzaq: { name: 'عبد الرزاق بن همام', sub: 'عالم اليمن · شيخ أحمد', lines: [
    { t: 'أبو بكر الحميري مولاهم الصنعاني، الحافظ الكبير عالم اليمن. وُلد سنة ١٢٦ (من قوله عند أحمد).', r: '٩/٥٦٣–٥٨٠' },
    { t: 'ارتحل إلى الحجاز والشام والعراق، وحدّث عن هشام بن حسان وابن جريج ومعمر (فأكثر عنه) والأوزاعي والثوري ومالك.', r: '٩/٥٦٣–٥٨٠' },
    { t: 'قال: «لزمتُ معمرًا ثماني سنين». وحدّث عنه ابن عيينة وأحمد وابن راهويه وابن معين وابن المديني.', r: '٩/٥٦٣–٥٨٠' },
    { t: 'قال أحمد: «أتينا عبد الرزاق قبل المئتين وهو صحيح البصر، ومن سمع منه بعدما ذهب بصره فهو ضعيف السماع».', r: '٩/٥٦٣–٥٨٠' },
    { t: 'توفي في شوال سنة ٢١١ هـ.', r: '٩/٥٨٠' }
  ], note: 'وُصف بالتشيّع في «السير». لم أقرأ ترجمته في «طبقات الحنابلة».' },

  shuayb: { name: 'أبو شعيب شعيب بن إسحاق القرشي الدمشقي', sub: 'فقيه حنفي · أخذ عن أبي حنيفة', lines: [
    { t: 'شعيب بن إسحاق بن عبد الرحمن بن عبد الله بن راشد، الإمام الفقيه، أبو شعيب القرشي مولاهم، الدمشقي، الحنفي.', r: '٩/١٠٣', m: 'الجواهر ٢/٢٥٠' },
    { t: 'أخذ الفقه عن أبي حنيفة، وكان من ثقات أهل الرأي، متقنًا مجوِّدًا للحديث. وعدّه النسائي في «الثقات» من أصحاب أبي حنيفة.', r: '٩/١٠٣', m: 'الجواهر ٢/٢٥٠' },
    { t: 'قال أحمد: «جالس أبا حنيفة»، و«ما أصحّ حديثه» ووثّقه. وذكره ابن حزم في فقهاء الشام في طبقة الأوزاعي والوليد بن مسلم.', m: 'الجواهر ٢/٢٥١' },
    { t: 'قال الوليد بن مسلم: «رأيتُ الأوزاعي يقرّب شعيب بن إسحاق ويدنيه». وقال ابن معين: هو مثل يونس وعقيل في الزهري.', m: 'الجواهر ٢/٢٥١' },
    { t: 'سمع أبا حنيفة وهشام بن عروة والأوزاعي وابن جريج، وروى عنه الليث بن سعد وهشام بن عمار. روى له الشيخان.', r: '٩/١٠٣', m: 'الجواهر ٢/٢٥١' },
    { t: 'وفاته: ١٨٩ هـ بدمشق عن اثنتين وسبعين سنة عند الذهبي (السير ٩/١٠٣)، و١٩٨ هـ عند القرشي (الجواهر ٢/٢٥١). والروايتان متباينتان وقد أثبتّهما كما وردتا.', r: '٩/١٠٣', m: 'الجواهر ٢/٢٥١' }
  ] },
  balkhi: { name: 'أبو عمر حفص بن عبد الرحمن البلخي', sub: 'قاضي نيسابور · من أفقه أصحاب أبي حنيفة الخراسانيين', lines: [
    { t: 'حفص بن عبد الرحمن بن عمر بن فرّوخ البلخي، أبو عمر، المعروف بالنيسابوري، قاضي نيسابور ابن قاضيها.', m: 'الجواهر ٢/١٣٧' },
    { t: 'قال القرشي: «كان من أفقه أصحاب أبي حنيفة الخراسانيين».', m: 'الجواهر ٢/١٣٨' },
    { t: 'الإمام الفقيه، مفتي خراسان، أبو عمر البلخي ثم النيسابوري، الحنفي. حدّث عن عاصم الأحول وداود بن أبي هند وابن عون وأبي حنيفة وعيسى بن طهمان وابن أبي عروبة والثوري وإسرائيل.', r: '٩/٣١٠' },
    { t: 'روى عن إسرائيل بن يونس وحجاج بن أرطاة والثوري وغيرهم.', m: 'الجواهر ٢/١٣٨' },
    { t: 'قال أبو حاتم والنسائي: صدوق. وذكره ابن حبان في «الثقات».', m: 'الجواهر ٢/١٣٨' },
    { t: 'قال الحاكم: ولي القضاء بنيسابور ثم ندم وأقبل على العبادة، وكان ابن المبارك إذا أقام بنيسابور لا يدع زيارته.', m: 'الجواهر ٢/١٣٨' },
    { t: 'مات في ذي القعدة سنة ١٩٩ هـ (عن ابن بنته إبراهيم بن منصور).', m: 'الجواهر ٢/١٣٨' }
  ] },
  hasan: { name: 'الحسن بن زياد اللؤلؤي', sub: 'فقيه العراق · صاحب أبي حنيفة', lines: [
    { t: 'أبو علي الأنصاري مولاهم الكوفي اللؤلؤي، العلامة فقيه العراق، صاحب أبي حنيفة. نزل بغداد وصنّف وتصدّر للفقه.', r: '٩/٥٤٣', m: 'الجواهر ٢/٥٦' },
    { t: 'تكرّر ذكره في «الهداية» و«الخلاصة».', m: 'الجواهر ٢/٥٦' },
    { t: 'قال يحيى بن آدم: «ما رأيت أفقه من الحسن بن زياد».', m: 'الجواهر ٢/٥٦' },
    { t: 'ولي القضاء ثم استعفى عنه. وكان محبًّا للسنة واتّباعها، حتى كان يكسو مماليكه كما يكسو نفسه اتّباعًا لقوله ﷺ: «ألبسوهم مما تلبسون».', m: 'الجواهر ٢/٥٦' },
    { t: 'كان يختلف إلى زفر وأبي يوسف في الفقه. وقال: «كان أبو يوسف أوسع صدرًا إلى التعليم من زفر».', m: 'الجواهر ٢/٥٧' },
    { t: 'قال السمعاني: «كان عالمًا بروايات أبي حنيفة، وكان حسن الخلق». وقال السرخسي: «المقدَّم في السؤال والتفريع».', m: 'الجواهر ٢/٥٧' },
    { t: 'توفي سنة ٢٠٤ هـ.', m: 'الجواهر ٢/٥٧' }
  ], quote: { t: 'كتبتُ عن ابن جريج اثني عشر ألف حديث، كلها يحتاج إليها الفقهاء', by: 'الحسن بن زياد', m: 'الجواهر ٢/٥٧' } },
  hafs: { name: 'أبو حفص الكبير أحمد بن حفص', sub: 'شيخ ما وراء النهر · تلميذ محمد بن الحسن', lines: [
    { t: 'أحمد بن حفص أبو حفص البخاري، الفقيه العلامة، شيخ ما وراء النهر، فقيه المشرق، والد شيخ الحنفية أبي عبد الله محمد بن أحمد بن حفص.', r: '١٠/١٥٧' },
    { t: 'ارتحل وصحب محمد بن الحسن مدة وبرع في الرأي، وسمع من وكيع وأبي أسامة. وُلد سنة ١٥٠.', r: '١٠/١٥٧–١٥٨' },
    { t: 'المعروف بأبي حفص الكبير، «الإمام المشهور». أخذ العلم عن محمد بن الحسن، «وله أصحاب لا يُحصون».', m: 'الجواهر ١/١٦٦' },
    { t: 'ذكر السمعاني أن بـ«بخيزاخزي» قرب بخارى جماعة من الفقهاء من أصحاب أبي حفص الكبير.', m: 'الجواهر ١/١٦٦' },
    { t: 'مات ببخارى في المحرم سنة ٢١٧ هـ.', r: '١٠/١٥٩' },
    { t: 'نقل القرشي عن شمس الأئمة حكاية في قدوم البخاري بخارى زمن أبي حفص وإفتائه فيها ونهي أبي حفص له، واستبعد اللكنوي وقوعها لجلالة قدر البخاري.', m: 'الجواهر ١/١٦٦' }
  ] },
  jawz: { name: 'أبو سليمان موسى بن سليمان الجوزجاني', sub: 'راوية كتب أبي يوسف ومحمد', lines: [
    { t: 'العلامة الإمام، أبو سليمان موسى بن سليمان الجوزجاني، الحنفي، صاحب أبي يوسف ومحمد، حدّث عنهما وعن ابن المبارك. وكان صدوقًا محبوبًا إلى أهل الحديث.', r: '١٠/١٩٤' },
    { t: 'كان رفيقًا للمعلّى بن منصور في أخذ الفقه ورواية الكتب، وهو «أسنّ وأشهر من المعلّى».', m: 'الجواهر ٣/٥١٨' },
    { t: 'عرض عليه المأمون القضاء فلم يتقلّده.', m: 'الجواهر ٣/٥١٨' },
    { t: 'توفي بعد المئتين.', m: 'الجواهر ٣/٥١٨' }
  ], quote: { t: 'يا أمير المؤمنين، احفظ حقوق الله في القضاء، ولا تولِّ على أمانتك مثلي، فإني والله غير مأمون الغضب، ولا أرضى لنفسي أن أحكم في عباده', by: 'الجوزجاني للمأمون', m: 'الجواهر ٣/٥١٨' } },
  mualla: { name: 'مُعلّى بن منصور الرازي', sub: 'مفتي بغداد · راوية كتب أبي يوسف ومحمد', lines: [
    { t: 'العلامة الحافظ الفقيه، أبو يعلى الحنفي، نزيل بغداد ومفتيها.', r: '١٠/٣٦٥' },
    { t: 'ذكره صاحب «الهداية». روى عن أبي يوسف ومحمد الكتب والأمالي، وشاركه في ذلك الجوزجاني، «وهما من الورع والدين وحفظ الفقه والحديث بالمنزلة الرفيعة».', m: 'الجواهر ٣/٤٩٢' },
    { t: 'عرض عليهما المأمون القضاء فلم يتقلّداه. وسكن بغداد.', m: 'الجواهر ٣/٤٩٢' },
    { t: 'روى عن مالك والليث وحماد وابن عيينة. وروى عنه ابن المديني وأبو بكر بن أبي شيبة والبخاري في غير «الجامع».', m: 'الجواهر ٣/٤٩٢' },
    { t: 'مات سنة ٢١١ هـ (ابن سعد وأحمد بن زهير). وقال الذهبي: «كان صاحب سنة واتباع، وكان بريئًا من التجهم».', r: '١٠/٣٦٩' }
  ] },
  kindi: { name: 'بشر بن الوليد الكندي', sub: 'قاضي العراق · صاحب أبي يوسف', lines: [
    { t: 'بشر بن الوليد بن خالد، أبو الوليد الكندي، الإمام العلامة المحدّث الصادق، قاضي العراق، الحنفي.', r: '١٠/٦٧٣', m: 'الجواهر ١/٤٥٢' },
    { t: 'سمع مالكًا وحماد بن زيد وعبد الرحمن بن الغسيل. وهو من أصحاب أبي يوسف خاصة، وعنه أخذ الفقه وروى كتبه وأماليه.', m: 'الجواهر ١/٤٥٢–٤٥٣' },
    { t: 'كان جميل المذهب، حسن الطريقة، صالحًا ديّنًا عابدًا، واسع الفقه، خشنًا في باب الحكم. وكان متحاملًا على محمد بن الحسن.', m: 'الجواهر ١/٤٥٢' },
    { t: 'قال أحمد بن عطية: كان يصلّي كل يوم مئتي ركعة، يصلّيها بعدما فُلج وشاخ.', m: 'الجواهر ١/٤٥٣' },
    { t: 'في محنة خلق القرآن (سنة ٢١٨) سُئل عن القرآن فقال: «أقول كلام الله»، ولم يزد. ثم وُلّي القضاء ببغداد في الجانبين، وحُبس في منزله زمن المعتصم لما سُعي به، ثم أُطلق.', m: 'الجواهر ١/٤٥٣–٤٥٤' },
    { t: 'قال الدارقطني: ثقة، وقال صالح جزرة: صدوق. توفي سنة ٢٣٨ هـ. روى له أبو داود.', m: 'الجواهر ١/٤٥٤' }
  ], quote: { t: 'أقول كلام الله', by: 'بشر بن الوليد في المحنة', m: 'الجواهر ١/٤٥٣' } },
  birti: { name: 'أبو العباس أحمد بن محمد البِرتي', sub: 'قاضٍ حافظ عابد', lines: [
    { t: 'أبو العباس أحمد بن محمد بن عيسى بن الأزهر البِرتي البغدادي، الفقيه الحافظ، من طبقة أحمد بن أبي عمران أستاذ الطحاوي.', r: '١٣/٤٠٧', m: 'الجواهر ١/٣٠١' },
    { t: 'تفقّه على أبي سليمان الجوزجاني، وروى عنه كتب محمد بن الحسن. وحدّث بالكثير وصنّف «المسند».', m: 'الجواهر ١/٣٠١' },
    { t: 'حدّث عن القعنبي ومسدّد وأبي بكر بن أبي شيبة، وروى عنه يحيى بن صاعد والمحاملي.', m: 'الجواهر ١/٣٠١' },
    { t: 'قال الخطيب: «كان ثقة حجة، يُذكر بالصلاح والعبادة». كان من أصحاب القاضي يحيى بن أكثم، وتقلّد واسط، وكان إليه أحد جانبي بغداد ثم استعفى في أيام المعتضد ولزم بيته للعبادة.', m: 'الجواهر ١/٣٠١–٣٠٢' },
    { t: 'مات ليلة السبت لتسع عشرة ليلة خلت من ذي الحجة سنة ٢٨٠ هـ (أحمد بن كامل).', m: 'الجواهر ١/٣٠٢' }
  ] },
  hamid: { name: 'القاضي أبو خازم عبد الحميد بن عبد العزيز', sub: 'قاضي القضاة · شيخ الطحاوي', lines: [
    { t: 'العلامة قاضي القضاة، أبو خازم السكوني البصري ثم البغدادي، الحنفي. أصله من البصرة.', r: '١٣/٥٣٩', m: 'الجواهر ٢/٣٦٧' },
    { t: 'ذكره صاحب «الهداية» في الرهن. وأخذ العلم عن بكر العمّي، وكان «جليل القدر».', m: 'الجواهر ٢/٣٦٦–٣٦٧' },
    { t: 'ولي القضاء بالشام والكوفة والكرخ من بغداد، وتولّى القضاء للمعتضد ثم ابنه المكتفي.', m: 'الجواهر ٢/٣٦٧' },
    { t: 'تفقّه عليه أبو جعفر الطحاوي وأبو طاهر الدبّاس، ولقيه أبو الحسن الكرخي وحضر مجلسه.', m: 'الجواهر ٢/٣٦٧' },
    { t: 'مات سنة ٢٩٢ هـ.', m: 'الجواهر ٢/٣٦٧' }
  ] },
  nays: { name: 'عبد الرحمن بن الحسين، أبو سعيد النيسابوري', sub: 'قاضٍ · شيخ الحنفية بنيسابور', lines: [
    { t: 'القاضي العلامة، شيخ أهل الرأي بخراسان، أبو سعيد النيسابوري، الحنفي.', r: '١٤/٢٨٤', m: 'الجواهر ٢/٣٧٨' },
    { t: 'سمع أبا زرعة الرازي ومحمد بن رافع، وروى عنه ابنه عبد الحميد القاضي وأبو العباس أحمد بن هارون.', m: 'الجواهر ٢/٣٧٨' },
    { t: 'توفي يوم السبت النصف من جمادى الأولى سنة ٣٠٩ هـ (عن ابنه عبد الحميد).', m: 'الجواهر ٢/٣٧٨' }
  ], quote: { t: 'واخطُ مع الدهر إذا ما خطا … واجرِ مع الدهر كما يجري', by: 'أبو سعيد النيسابوري (بيت كان يردّده)', m: 'الجواهر ٢/٣٧٨' } },
  tanukhi: { name: 'أبو جعفر أحمد بن إسحاق التنوخي', sub: 'القاضي الكبير · فقيه ونحوي', lines: [
    { t: 'أبو جعفر التنوخي الأنباري النحوي القاضي، من بيت تنوخ بالأنبار. وُلد بالأنبار في المحرم سنة ٢٣١.', r: '١٤/٤٩٧', m: 'الجواهر ١/١٣٧' },
    { t: 'سمع أباه ويعقوب الدورقي ومحمد بن المثنى العنزي، وروى عنه الدارقطني وابن شاهين وحفيده جعفر بن محمد.', m: 'الجواهر ١/١٣٧' },
    { t: 'قال الخطيب: «كان ثبتًا في الحديث، ثقة مأمونًا… متقنًا في علوم شتى، منها الفقه على مذهب أبي حنيفة وأصحابه، وربما خالفهم في مسيئلات يسيرة».', m: 'الجواهر ١/١٣٨' },
    { t: 'تولى القضاء بالأنبار وهيت وطريق الفرات من قبل الموفق سنة ٢٧٦، ثم للناصر، ثم للمعتضد، وقلّده المقتدر سنة ٢٩٦ القضاء بمدينة المنصور وغيرها، وصُرف عنها سنة ٣١٧.', m: 'الجواهر ١/١٣٨–١٣٩' },
    { t: 'مات سنة ٣١٨ هـ.', r: '١٤/٤٩٨' },
    { t: 'له «الناسخ والمنسوخ»، و«الدعاء»، و«أدب القاضي» (لم يتمّه)، وكتاب في النحو على مذهب الكوفيين.', m: 'الجواهر ١/١٣٧' }
  ] },
  shafii_t: { name: 'الشافعي', sub: 'إمام المذهب الشافعي', imam: 'shafii', lines: [] },
  malik_t: { name: 'مالك بن أنس', sub: 'إمام المذهب المالكي', imam: 'maliki', lines: [] },
  ahmad_t: { name: 'أحمد بن حنبل', sub: 'إمام المذهب الحنبلي', imam: 'hanbali', lines: [] },

  muhammad: { name: 'محمد بن الحسن الشيباني', sub: 'فقيه العراق · تلميذ أبي حنيفة وشيخ الشافعي', lines: [
    { t: 'أبو عبد الله الشيباني الكوفي، وُلد بواسط ونشأ بالكوفة (ابن سعد: ولد سنة ١٣٢). أصله من قرية حرستا بدمشق.', r: '٩/١٣٤–١٣٦', m: 'الجواهر ٣/١٢٣' },
    { t: 'أخذ عن أبي حنيفة بعض الفقه وأتمّه على أبي يوسف، وروى عن مسعر والأوزاعي ومالك. وولي القضاء للرشيد بعد أبي يوسف.', r: '٩/١٣٤–١٣٦', m: 'الجواهر ٣/١٢٣، ١٢٥' },
    { t: 'قال: «أقمتُ عند مالك ثلاث سنين وكسرًا وسمعت من لفظه سبع مئة حديث». وقال محقق «السير» في الحاشية: روايته للموطأ من أجود الروايات.', r: '٩/١٣٥' },
    { t: 'أخذ عنه الشافعي فأكثر، وأبو عبيد، وابن معين (كتب عنه الجامع الصغير).', r: '٩/١٣٤–١٣٦', m: 'الجواهر ٣/١٢٣–١٢٤' },
    { t: 'قال الشافعي: «أخذتُ من محمد بن الحسن وِقرَ بعير، وما رأيتُ رجلًا سمينًا أفهمَ منه». وقال أحمد: مسائلي الدقيقة من كتب محمد بن الحسن.', m: 'الجواهر ٣/١٢٣–١٢٤' },
    { t: 'توفي بالري سنة ١٨٩ هـ عند الذهبي (السير ٩/١٣٦)، وسنة ١٨٧ هـ عند القرشي في اليوم الذي مات فيه الكسائي (الجواهر ٣/١٢٥–١٢٦)؛ أثبتُّ الروايتين.', r: '٩/١٣٦', m: 'الجواهر ٣/١٢٥–١٢٦' }
  ], quote: { t: 'أقمتُ عند مالك ثلاث سنين وكسرًا وسمعت من لفظه سبع مئة حديث', by: 'محمد بن الحسن', r: '٩/١٣٥' } },

  zufar: { name: 'زفر بن الهذيل', sub: 'تلميذ أبي حنيفة · «أقيس أصحابه»', lines: [
    { t: 'أبو الهذيل العنبري، الفقيه المجتهد. وُلد سنة ١١٠. «تفقّه بأبي حنيفة وهو أكبر تلامذته».', r: '٨/٣٨–٤١', m: 'الجواهر ٢/٢٠٧–٢٠٨' },
    { t: 'حدّث عن الأعمش وإسماعيل بن أبي خالد وأبي حنيفة وابن إسحاق. وقال ابن معين: «ثقة مأمون».', r: '٨/٣٨–٤١', m: 'الجواهر ٢/٢٠٧' },
    { t: 'كان وداود الطائي متواخيين، فترك داود الفقه وأقبل على العبادة، وجمع زفر بينهما.', r: '٨/٣٨–٤١' },
    { t: 'رجع عن قتل المسلم بالذمي لما ذُكّر بحديث «لا يقتل مسلم بكافر»، فقال الذهبي: «هكذا يكون العالم وقّافًا مع النص».', r: '٨/٤٠–٤١' },
    { t: 'توفي سنة ١٥٨ هـ (ابن سعد). وولي قضاء البصرة.', r: '٨/٤١', m: 'الجواهر ٢/٢٠٧–٢٠٨' }
  ] },

  yusuf: { name: 'القاضي أبو يوسف', sub: 'قاضي القضاة · أنبل تلاميذ أبي حنيفة', lines: [
    { t: 'يعقوب بن إبراهيم بن حبيب بن خنيس بن سعد بن حبتة الأنصاري (قال ابن عبد البر: لا يختلفون فيه). وُلد سنة ١١٣ (السير).', r: '٨/٥٣٥–٥٣٨', m: 'الجواهر ٣/٦١١' },
    { t: 'أخذ الفقه عن أبي حنيفة وهو «المقدَّم من أصحابه». قال ابن عبد البر: لا أعلم قاضيًا كان إليه تولية القضاة في الآفاق من الشرق إلى الغرب إلا أبا يوسف في زمانه. ووثّقه أحمد وابن معين وابن المديني.', m: 'الجواهر ٣/٦١٢' },
    { t: 'حدّث عن هشام بن عروة ويحيى الأنصاري وعطاء بن السائب والأعمش وأبي حنيفة «ولزمه وتفقّه به وهو أنبل تلامذته وأعلمهم».', r: '٨/٥٣٥–٥٣٨' },
    { t: 'كان أبوه فقيرًا، وكان أبو حنيفة يتعاهده بالدراهم. وقال: «صحبت أبا حنيفة سبع عشرة سنة».', r: '٨/٥٣٥–٥٣٨' },
    { t: 'تخرّج به محمد بن الحسن وهلال الرأي وابن سماعة، وحدّث عنه ابن معين وأحمد وأسد بن الفرات.', r: '٨/٥٣٥–٥٣٨' },
    { t: 'ولي القضاء لثلاثة خلفاء: المهدي والهادي والرشيد.', m: 'الجواهر ٣/٦١٢' },
    { t: 'توفي ببغداد يوم الخميس خامس ربيع الأول سنة ١٨٢ هـ (وقيل: ربيع الآخر)، وعاش ٦٩ سنة.', r: '٨/٥٣٨', m: 'الجواهر ٣/٦١٢' }
  ], quote: { t: 'كل ما أفتيت به فقد رجعت عنه إلا ما وافق الكتاب والسنة', by: 'أبو يوسف قبل موته', r: '٨/٥٣٥–٥٣٨' } },

  qasim: { name: 'عبد الرحمن بن القاسم', sub: 'عالم مصر · تلميذ مالك', lines: [
    { t: 'أبو عبد الله العتقي مولاهم المصري، عالم الديار المصرية ومفتيها. وُلد سنة ١٣٢.', r: '٩/١٢٠–١٢٥' },
    { t: 'روى عن مالك وعبد الرحمن بن شريح وبكر بن مضر، وحدّث عنه أصبغ والحارث بن مسكين وسحنون.', r: '٩/١٢٠–١٢٥' },
    { t: 'كان ذا مال فأنفقه في العلم، ويمتنع من جوائز السلطان. وخرج إلى الحجاز اثنتي عشرة مرة أنفق في كل مرة ألف دينار.', r: '٩/١٢٠–١٢٥' },
    { t: 'قال ابن وهب: كنا نخرج إلى مالك فسنة أسأله أنا وسنة يسأله ابن القاسم.', r: '٩/١٢٠–١٢٥' },
    { t: 'توفي في صفر سنة ١٩١ هـ وعاش ٥٩ سنة.', r: '٩/١٢٥' }
  ],
  note: 'ترجمته في «ترتيب المدارك» ٢/٤٣٣ كما أحالت إليه حواشي «السير»، ولم أقرأها مباشرة.' },

  wahb: { name: 'عبد الله بن وهب', sub: 'حافظ مصر · تلميذ مالك', lines: [
    { t: 'أبو محمد الفهري مولاهم المصري، الإمام الحافظ. مولده سنة ١٢٥. طلب العلم وله سبع عشرة سنة.', r: '٩/٢٢٣–٢٣٣', m: 'المدارك ٢/٤٢١–٤٣١ (إحالة المحقق)' },
    { t: 'روى عن ابن جريج ويونس بن يزيد والليث ومالك وابن لهيعة. وقال: «سمعت من ثلاث مئة وسبعين شيخًا».', r: '٩/٢٢٣–٢٣٣', m: 'المدارك ٢/٤٢١–٤٣١ (إحالة المحقق)' },
    { t: 'حدّث عنه الليث وابن مهدي وأصبغ وسحنون ويحيى بن يحيى الليثي ويونس بن عبد الأعلى والربيع بن سليمان.', r: '٩/٢٢٣–٢٣٣' },
    { t: 'لم يكتب مالك لأحد بـ«الفقيه» إلا إلى ابن وهب: «إلى عبد الله بن وهب فقيه مصر».', r: '', m: 'المدارك ٢/٤٢١–٤٣١ (إحالة المحقق)' },
    { t: 'عُرض عليه القضاء فجنّن نفسه ولزم بيته.', r: '٩/٢٢٩ و٩/٢٣٣' },
    { t: 'مات في شعبان سنة ١٩٧ هـ وعاش اثنتين وسبعين سنة (يونس بن عبد الأعلى).', r: '٩/٢٢٩' }
  ], quote: { t: 'لولا مالك لضللتُ في العلم', by: 'ابن وهب', m: 'المدارك ٢/٤٢١–٤٣١ (إحالة المحقق)' },
  note: 'المدارك: أحلتُ إلى المواضع التي ذكرها محقق «السير» (٢/٤٢١–٤٣١)، ولم أقرأها مباشرة.' },

  buwayti: { name: 'أبو يعقوب البويطي', sub: 'خليفة الشافعي في حلقته', lines: [
    { t: 'يوسف بن يحيى المصري، «سيد الفقهاء»، صاحب الشافعي، لازمه وتخرّج به وفاق الأقران.', r: '١٢/٥٨–٦١', m: 'طبقات الشافعيين ص١٥٩' },
    { t: 'حدّث عن ابن وهب والشافعي، وروى عنه الربيع المرادي وإبراهيم الحربي والدارمي وأبو حاتم.', r: '١٢/٥٨–٦١' },
    { t: 'وُصف بأنه «إمام في العلم، قدوة في العمل، زاهد ربّاني متهجد دائم الذكر».', r: '١٢/٥٨–٦١' },
    { t: 'حُمل في محنة خلق القرآن إلى بغداد مغلولًا بحديد وزنه أربعون رطلًا، وامتنع عن القول بخلق القرآن.', r: '١٢/٥٨–٦١', m: 'طبقات الشافعيين ص١٦٠–١٦١' },
    { t: 'مات في قيده مسجونًا بالعراق سنة ٢٣١ هـ، وقيل ٢٣٢؛ والصحيح عند ابن كثير أنه مات في رجب سنة ٢٣١.', r: '١٢/٦١', m: 'طبقات الشافعيين ص١٦٠' }
  ], quote: { t: 'إنما خلق الله الخلق بـ«كن»', by: 'البويطي في محنة خلق القرآن', r: '١٢/٥٨–٦١' } },

  rabi: { name: 'الربيع بن سليمان المرادي', sub: 'راوية كتب الشافعي', lines: [
    { t: 'أبو محمد المرادي مولاهم المصري المؤذن، صاحب الشافعي وناقل علمه، شيخ المؤذنين بجامع الفسطاط. مولده ١٧٤ أو قبلها بعام.', r: '١٢/٥٨٧–٥٩٠', m: 'طبقات الشافعيين ص١٣٥–١٣٦' },
    { t: 'سمع ابن وهب وبشر بن بكر والشافعي. ولم يكن صاحب رحلة، وما رُوي أن الشافعي بعثه بكتابه إلى أحمد «غير صحيح».', r: '١٢/٥٨٧–٥٩٠' },
    { t: 'حدّث عنه أبو داود وابن ماجه والنسائي والطحاوي وأبو زرعة وأبو حاتم.', r: '١٢/٥٨٧–٥٩٠', m: 'طبقات الشافعيين ص١٣٥' },
    { t: 'رحل إليه نحو مئتي رجل في كتب الشافعي (ابن عبد البر عن الترمذي).', r: '', m: 'طبقات الشافعيين ص١٣٥' },
    { t: 'قال الذهبي: «ما يبلغ رتبة المزني، كما أن المزني لا يبلغ رتبته في الحديث». وكانت فيه سلامة وغفلة.', r: '١٢/٥٨٧–٥٩٠' },
    { t: 'توفي سنة ٢٧٠ هـ.', r: '١٢/٥٨٧–٥٩٠', m: 'طبقات الشافعيين ص١٣٥' }
  ], quote: { t: 'كل محدّث بعد ابن وهب كنت مستمليه', by: 'الربيع بن سليمان', m: 'طبقات الشافعيين ص١٣٥' },
  note: 'هو غير الربيع الجيزي (ت ٢٥٦ هـ) الذي يسبقه في ابن كثير.' },

  bukhari: { name: 'البخاري', sub: 'صاحب «الجامع الصحيح» · تلميذ أحمد', lines: [
    { t: 'أبو عبد الله محمد بن إسماعيل بن إبراهيم بن المغيرة بن بردزبه الجعفي. أسلم جدّه المغيرة على يد اليمان الجعفي والي بخارى.', r: '١٢/٣٩١–٤٧١' },
    { t: 'وُلد في شوال سنة ١٩٤ هـ.', r: '١٢/٣٩١–٤٧١' },
    { t: 'قال: «لم أُخرّج في الكتاب إلا صحيحًا، وما تركت من الصحيح أكثر». وقيل: سمع الصحيحَ منه تسعون ألفًا.', r: '١٢/٣٩١–٤٧١' },
    { t: 'له «الجامع الصحيح» و«التاريخ».', r: '', m: 'طبقات الحنابلة ٢/٢٤٢' }
  ], quote: { t: 'لم أُخرّج في الكتاب إلا صحيحًا، وما تركت من الصحيح أكثر', by: 'البخاري', r: '١٢/٣٩١–٤٧١' }, note: 'لم تُقرأ نهاية ترجمته في «السير»، فلا أكتب سنة وفاته منها.' },

  muslim: { name: 'مسلم بن الحجاج', sub: 'صاحب «الصحيح» · تلميذ أحمد', lines: [
    { t: 'أبو الحسين القشيري النيسابوري، الإمام الحافظ الحجة. وُلد سنة ٢٠٤ (قيل). أول سماعه سنة ٢١٨ من يحيى بن يحيى التميمي.', r: '١٢/٥٥٧–٥٨٠' },
    { t: 'حجّ سنة ٢٢٠ وسمع بمكة من القعنبي (أكبر شيوخه)، وسمع بالعراق والحرمين ومصر، ومن شيوخه أحمد بن حنبل وإسحاق بن راهويه.', r: '١٢/٥٥٧–٥٨٠', m: 'طبقات الحنابلة ٢/٤١٣' },
    { t: 'قال: «ما وضعت في هذا المسند شيئًا إلا بحجة، ولا أسقطت شيئًا منه إلا بحجة».', r: '١٢/٥٨٠' },
    { t: 'قدّمه أبو زرعة وأبو حاتم في معرفة الصحيح على مشايخ عصرهما.', r: '١٢/٥٥٧–٥٨٠' },
    { t: 'توفي في رجب سنة ٢٦١ هـ بنيسابور عن بضع وخمسين سنة.', r: '١٢/٥٨٠' }
  ], quote: { t: 'ما وضعت في هذا المسند شيئًا إلا بحجة، ولا أسقطت شيئًا منه إلا بحجة', by: 'مسلم بن الحجاج', r: '١٢/٥٨٠' } },

  dawud: { name: 'أبو داود', sub: 'صاحب «السنن» · تلميذ أحمد', lines: [
    { t: 'سليمان بن الأشعث الأزدي السجستاني، شيخ السنة ومقدّم الحفاظ، محدّث البصرة. وُلد سنة ٢٠٢.', r: '١٣/٢٠٣–٢٢١', m: 'طبقات الحنابلة ١/٤٢٧' },
    { t: 'سمع بمكة من القعنبي، وبالبصرة من مسلم بن إبراهيم وأبي الوليد الطيالسي، وبالكوفة من أحمد بن يونس، ودخل بغداد وهو ابن ثماني عشرة سنة.', r: '١٣/٢٠٣–٢٢١' },
    { t: 'أخباره مع الإمام أحمد مبثوثة في «مناقب أحمد».', r: '', m: 'طبقات الحنابلة ١/٤٢٧' },
    { t: 'توفي سادس عشر شوال سنة ٢٧٥ هـ.', r: '١٣/٢٢١' }
  ], note: 'لم أقرأ نص ترجمته في «طبقات الحنابلة» كاملًا، واكتفيتُ بإحالته إليها.' },

  salih: { name: 'صالح بن أحمد بن حنبل', sub: 'ابن الإمام · قاضي أصبهان', lines: [
    { t: 'أبو الفضل الشيباني البغدادي، المحدّث الفقيه القاضي، قاضي أصبهان.', r: '١٢/٥٢٩' },
    { t: 'سمع أباه وتفقّه عليه، وسمع عفان وأبا الوليد وعلي بن المديني.', r: '١٢/٥٢٩' },
    { t: 'حدّث عنه ابنه زهير وابن أبي عاصم والبغوي وابن صاعد.', r: '١٢/٥٢٩' },
    { t: 'مات سنة ٢٦٥ هـ (ذُكر في وفيات تلك السنة).', r: '١٢/٣٩١' }
  ], note: 'لم أقرأ ترجمته في «طبقات الحنابلة» مباشرة؛ ورقم ١/١١٩ فيه هو لحفيده «أحمد بن صالح» فلا يُنسب إليه.' },

  abdullah: { name: 'عبد الله بن أحمد', sub: 'راوي «المسند» عن أبيه', lines: [
    { t: 'أبو عبد الرحمن الشيباني المروزي ثم البغدادي، الإمام الحافظ الناقد محدّث بغداد. وُلد سنة ٢١٣، وهو أصغر من أخيه صالح.', r: '١٣/٥١٦–٥٢٥' },
    { t: 'روى عن أبيه شيئًا كثيرًا (المسند كله والزهد)، وامتنع من الأخذ عن علي بن الجعد لوقفه في مسألة القرآن.', r: '١٣/٥١٦–٥٢٥' },
    { t: 'حدّث عنه النسائي والبغوي وابن صاعد وأبو عوانة.', r: '١٣/٥١٦–٥٢٥' },
    { t: 'قال الذهبي: «كان صيّنًا دينًا صادقًا، صاحب حديث واتباع وبصر بالرجال… وله زيادات كثيرة في مسند والده».', r: '١٣/٥١٦–٥٢٥' },

const PEOPLE_TABAQAT = {"tb57": {"name": "الأثرم أبو بكر أحمد بن محمد بن هانئ الإسكافي", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · لم تُعرف وفاته", "lines": [{"t": "«جليل القدر، حافظ، إمام»؛ سمع عفان وابن أبي شيبة والقعنبي وأحمد في آخرين", "r": "", "m": "طبقات الحنابلة ١/١٦٢"}, {"t": "«نقل عن إمامنا \"مسائل\" كثيرة، وصنّفها ورتّبها أبوابًا»", "r": "", "m": "طبقات الحنابلة ١/١٦٢"}, {"t": "ذكر أن أحمد كان يقول عند قيامه من المجلس: «سبحانك اللهم وبحمدك» يذهب إلى ما رُوي في كفارة المجلس", "r": "", "m": "طبقات الحنابلة ١/١٧٦"}, {"t": "قال المؤلف: «ولم يقع لي تاريخ وفاته»", "r": "", "m": "طبقات الحنابلة ١/١٧٦"}]}, "tb50": {"name": "المروذي أبو بكر أحمد بن محمد بن الحجاج", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٧٥ (حاشية المحقق)", "lines": [{"t": "كانت أمه مروذية وأبوه خوارزميًّا، «وهو المقدَّم من أصحاب أحمد لورعه وفضله، وكان إمامنا يأنس به وينبسط إليه، وهو الذي تولى إغماضه لما مات وغسّله»", "r": "", "m": "طبقات الحنابلة ١/١٣٧"}, {"t": "روى عنه «مسائل» كثيرة", "r": "", "m": "طبقات الحنابلة ١/١٣٧"}, {"t": "روى أن أحمد قال له: «قُدِم بي من خراسان وأنا حَمْل، ووُلدت هاهنا، ولم أرَ جدي ولا أبي، ولا تزوجت إلا بعد الأربعين»", "r": "", "m": "طبقات الحنابلة ١/١٥١"}, {"t": "لم أقف على تاريخ وفاته فيما قرأت من الترجمة؛ والمحقق أرّخه ٢٧٥", "r": "", "m": "طبقات الحنابلة ١/١٣٧ (حاشية المحقق)"}]}, "tb216": {"name": "أبو داود السجستاني سليمان بن الأشعث", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٧٥", "lines": [{"t": "«الإمام في زمانه»، رحل وطوّف وجمع وصنّف؛ سمع أبا الوليد الطيالسي وأحمد وخلقًا، وروى عنه ابنه عبد الله والنسائي والخلال، وسمع منه أحمد حديثًا واحدًا، وسكن البصرة", "r": "", "m": "طبقات الحنابلة ١/٤٢٨"}, {"t": "قال إبراهيم الحربي لما صنّف «السنن»: «أُلين لأبي داود الحديث كما أُلين لداود الحديد»", "r": "", "m": "طبقات الحنابلة ١/٤٣٣"}, {"t": "طلب منه الموفق أن يفرد لأولاده مجلسًا فقال: «أما هذه فلا سبيل إليها، لأن الناس شريفهم ووضيعهم في العلم سواء»", "r": "", "m": "طبقات الحنابلة ١/٤٣٣–٤٣٤"}, {"t": "ولد سنة ٢٠٢ وما ابلة ١/٢٨٥"}]}, "tb282": {"name": "الميموني أبو الحسن عبد الملك بن عبد الحميد الرقي", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٧٤ (حاشية المحقق)", "lines": [{"t": "سمع ابن علية وأبا معاوية ويزيد بن هارون", "r": "", "m": "طبقات الحنابلة ٢/٩٢"}, {"t": "قال الخلال: «الإمام في أصحاب أحمد، جليل القدر… فقيه البدن، كان أحمد يكرمه ويفعل معه ما لا يفعله مع أحد غيره»", "r": "", "m": "طبقات الحنابلة ٢/٩٢"}, {"t": "قال: صحبت أبا عبد الله على الملازمة من سنة ٢٠٥ إلى سنة ٢٢٧، وكان يضرب لي مثل ابن جريج في عطاء من كثرة ما أسأله", "r": "", "m": "طبقات الحنابلة ٢/٩٢–٩٣"}, {"t": "وعنده عن أحمد «مسائل» في ستة عشر جزءًا وجزأين كبيرين", "r": "", "m": "طبقات الحنابلة ٢/٩٣"}, {"t": "لم أقف على وفاته فيما قرأت من الترجمة؛ والمحقق أرّخه ٢٧٤", "r": "", "m": "طبقات الحنابلة ٢/٩٢ (حاشية المحقق)"}]}, "tb271": {"name": "أبو زرعة الرازي عبيد الله بن عبد الكريم بن يزيد بن فروخ", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٦٤ (حاشية المحقق)", "lines": [{"t": "سمع أبا نعيم والقعنبي وأبا الوليد الطيالسي وغيرهم، وقدم بغداد دفعات وجالس أحمد واستفاد منه", "r": "", "m": "طبقات الحنابلة ٢/٥٤–٥٥"}, {"t": "قال الخلال: «أبو زرعة وأبو حاتم إمامان في الحديث، رويا عن أبي عبد الله \"مسائل\" كثيرة… وكانا عالمين بأحمد بن حنبل يحفظان حديثه كله»", "r": "", "m": "طبقات الحنابلة ٢/٥٥"}, {"t": "قال عبد الله بن أحمد: لما قدم أبو زرعة نزل عند أبي، فسمعت أبي يقول: «ما صليت غير الفرض، استأثرت بمذاكرة أبي زرعة على نوافلي»", "r": "", "m": "طبقات الحنابلة ٢/٥٥"}, {"t": "لم أقف على وفاته فيما قرأت من الترجمة؛ والمحقق أرّخه ٢٠٠–٢٦٤", "r": "", "m": "طبقات الحنابلة ٢/٥٣ (حاشية المحقق)"}]}, "tb390": {"name": "أبو حاتم الرازي محمد بن إدريس بن المنذر الحنظلي", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٧٧ (حاشية المحقق)", "lines": [{"t": "«كان أحد الأئمة الحفاظ»؛ سمع محمد بن عبد الله الأنصاري وأحمد في آخرين، وأول كتبه الحديث سنة ٢٠٩", "r": "", "m": "طبقات الحنابلة ٢/٢٧١"}, {"t": "روى عنه يونس بن عبد الأعلى والربيع بن سليمان وهما أكبر منه، وقدم بغداد فروى عنه إبراهيم الحربي", "r": "", "m": "طبقات الحنابلة ٢/٢٧١"}, {"t": "قال: «أحصيت ما مشيت على قدمي ألف فرسخ، لم أزل أحصي حتى لما زاد على ألف فرسخ تركته»؛ وقال يونس بن عبد الأعلى: «أبو زرعة وأبو حاتم إماما خراسان»", "r": "", "m": "طبقات الحنابلة ٢/٢٧٣"}, {"t": "لم أقف على وفاته فيما قرأت من الترجمة؛ والمحقق أرّخه ١٩٥–٢٧٧", "r": "", "m": "طبقات الحنابلة ٢/٢٧٠ (حاشية المحقق)"}]}, "tb189": {"name": "حرب بن إسماعيل الكرماني الحنظلي", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٨٠ (حاشية المحقق)", "lines": [{"t": "قال الخلال: «رجل جليل، حثّني أبو بكر المروذي على الخروج إليه»", "r": "", "m": "طبقات الحنابلة ١/٣٨٨"}, {"t": "قال له حرب: هذه «المسائل» أربعة آلاف عن أبي عبد الله وإسحاق بن راهويه", "r": "", "m": "طبقات الحنابلة ١/٣٨٩"}, {"t": "«وكان رجلًا فقيه البلد، وكان السلطان قد جعله على أمر الحكم وغيره في البلد»", "r": "", "m": "طبقات الحنابلة ١/٣٨٩"}, {"t": "لم أقف على وفاته في الترجمة؛ ونقل المحقق أن ابن قانع قيّدها سنة ٢٨٠", "r": "", "m": "طبقات الحنابلة ١/٣٨٨ (حاشية المحقق)"}]}, "tb13": {"name": "أبو طالب المشكاني أحمد بن حميد", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٤٤ (حاشية المحقق)", "lines": [{"t": "«المتخصص بصحبة إمامنا أحمد، روى عن أحمد \"مسائل\" كثيرة، وكان أحمد يكرمه ويعظمه»", "r": "", "m": "طبقات الحنابلة ١/٨١"}, {"t": "روى عنه فوران وزكريا بن يحيى وغيرهما", "r": "", "m": "طبقات الحنابلة ١/٨١"}, {"t": "من مسائله عن أحمد في المسح: العمامة يُمسح عليها والخف يُمسح عليه، فإذا خلع أعاد، وليس الشعر مثل العمامة والخف", "r": "", "m": "طبقات الحنابلة ١/٨٤"}, {"t": "لم أقف على وفاته فيما قرأت من الترجمة؛ والمحقق أرّخه ٢٤٤", "r": "", "m": "طبقات الحنابلة ١/٨١ (حاشية المحقق)"}]}, "tb496": {"name": "مهنا بن يحيى الشامي السلمي أبو عبد الله", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · لم تُذكر وفاته", "lines": [{"t": "حدّث عن بقية وعبد الرزاق وأحمد في آخرين، وروى عنه عبد الله بن أحمد وسهل التستري", "r": "", "m": "طبقات الحنابلة ٢/٤٣٢–٤٣٣"}, {"t": "قال الخلال: «من كبار أصحاب أبي عبد الله، روى عنه من \"المسائل\" ما فخر به، وكان أبو عبد الله يكرمه ويعرف له حق الصحبة، ورحل معه إلى عبد الرزاق، وصحبه إلى أن مات»", "r": "", "m": "طبقات الحنابلة ٢/٤٣٣"}, {"t": "قال: «و\"مسائله\" أكثر من أن تُحد من كثرتها»، وكتب عنه عبد الله بن أحمد بضعة عشر جزءًا لم تكن عند غيره", "r": "", "m": "طبقات الحنابلة ٢/٤٣٣"}, {"t": "لم تُذكر وفاته فيما قرأت، ولم يؤرّخها المحقق", "r": "", "m": "طبقات الحنابلة ٢/٤٣٢ (حاشية المحقق)"}]}, "tb353": {"name": "الفضل بن زياد أبو العباس القطان البغدادي", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · لم تُذكر وفاته", "lines": [{"t": "قال الخلال: «كان من المتقدمين عند أبي عبد الله، وكان أبو عبد الله يعرف قدره ويكرمه، وكان يصلي بأبي عبد الله، فوقع له عنه \"مسائل\" كثيرة جياد»", "r": "", "m": "طبقات الحنابلة ٢/١٨٨–١٨٩"}, {"t": "حدّث عنه يعقوب بن سفيان الفسوي وأحمد الأدمي وجعفر الصندلي", "r": "", "m": "طبقات الحنابلة ٢/١٨٩"}, {"t": "لم تُذكر وفاته، والمحقق نقل أن الخطيب لم يذكرها", "r": "", "m": "طبقات الحنابلة ٢/١٨٩ (حاشية المحقق)"}]}, "tb140": {"name": "بكر بن محمد النسائي الأصل أبو أحمد البغدادي", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · لم تُذكر وفاته", "lines": [{"t": "«النسائي الأصل، البغدادي المنشأ»؛ قال الخلال: «كان أبو عبد الله يقدّمه ويكرمه، وعنده \"مسائل\" كثيرة سمعها من أبي عبد الله»", "r": "", "m": "طبقات الحنابلة ١/٣١٨"}, {"t": "لم تُذكر وفاته", "r": "", "m": "طبقات الحنابلة ١/٣١٨ (حاشية المحقق)"}]}, "tb530": {"name": "يحيى بن معين أبو زكريا المري", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٣٣", "lines": [{"t": "سمع ابن المبارك وهشيمًا وابن عيينة والقطان وابن مهدي ووكيعًا وأحمد، وروى عنه البخاري وأبو داود وعبد الله بن أحمد، «وكان إمامًا عالمًا حافظًا»", "r": "", "m": "طبقات الحنابلة ٢/٥٣١"}, {"t": "قال: خلوت بأحمد على باب عفان فقلت: ما تقول؟ فقال: «أقول أبو بكر وعمر وعثمان»", "r": "", "m": "طبقات الحنابلة ٢/٥٣١"}, {"t": "مات بالمدينة وهو يريد مكة سنة ٢٣٣، وحُمل على سرير النبي ﷺ، ودفن بالبقيع", "r": "", "m": "طبقات الحنابلة ٢/٥٣٧"}]}, "tb315": {"name": "علي بن المديني أبو الحسن علي بن عبد الله بن جعفر", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٣٤ (حاشية المحقق)", "lines": [{"t": "«الحافظ المبرّز، بصري الدار»؛ حدّث عن حماد بن زيد وابن عيينة ويحيى القطان وأحمد", "r": "", "m": "طبقات الحنابلة ٢/١٣٢"}, {"t": "قال: «ما قام أحد بأمر الإسلام بعد رسول الله ﷺ ما قام أحمد بن حنبل»، قيل: ولا أبو بكر؟ قال: «ولا أبو بكر، لأن أبا بكر كان له أعوان وأصحاب، وأحمد لم يكن له أعوان ولا أصحاب»", "r": "", "m": "طبقات الحنابلة ٢/١٣٦"}, {"t": "وقال: «لأن أسأل أحمد بن حنبل عن مسألة فيفتيني أحب إلي من أن أسأل أبا عاصم النبيل وابن داود، إن العلم ليس بالسن»", "r": "", "m": "طبقات الحنابلة ٢/١٣٦"}, {"t": "لم أقف على وفاته فيما قرأت؛ والمحقق أرّخه ١٦١–٢٣٤", "r": "", "m": "طبقات الحنابلة ٢/١٣١ (حاشية المحقق)"}]}, "tb333": {"name": "عباس الدوري أبو الفضل العباس بن محمد بن حاتم", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٧١", "lines": [{"t": "مولى بني هاشم، بغدادي؛ سمع شبابة وأبا النضر وعفان، وحدّث عنه يعقوب بن سفيان وعبد الله بن أحمد والنسائي والبغوي", "r": "", "m": "طبقات الحنابلة ٢/١٥٦–١٥٧"}, {"t": "ذكره الخلال فيمن صحب أحمد", "r": "", "m": "طبقات الحنابلة ٢/١٥٧"}, {"t": "سمع أحمد يقول: «أبو عبيد عندنا ممن يزداد كل يوم خيرًا»", "r": "", "m": "طبقات الحنابلة ٢/١٦٢"}, {"t": "مولده سنة ١٨٥، وموته لست عشرة خلت من صفر ٢٧١ وقد بلغ ثمانيًا وثمانين سنة (ابن المنادي)", "r": "", "m": "طبقات الحنابلة ٢/١٦٢–١٦٣"}]}, "tb387": {"name": "البخاري أبو عبد الله محمد بن إسماعيل الجعفي", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٥٦", "lines": [{"t": "«صاحب \"الجامع الصحيح\" و\"التاريخ\" وغيرهما من التصانيف»، رحل إلى أكثر محدثي الأمصار", "r": "", "m": "طبقات الحنابلة ٢/٢٤٢–٢٤٣"}, {"t": "سمع مكي بن إبراهيم والحميدي وابن معين وابن المديني وأحمد، وورد بغداد دفعات، وآخر من حدّث عنه بها المحاملي", "r": "", "m": "طبقات الحنابلة ٢/٢٤٣"}, {"t": "قال لأحمد: «القرآن من أوله إلى آخره كلام الله ليس شيء منه مخلوق…» قال: نعم", "r": "", "m": "طبقات الحنابلة ٢/٢٥٩"}, {"t": "ولد لثلاث عشرة خلت من شوال ١٩٤، وتوفي ليلة الفطر ٢٥٦", "r": "", "m": "طبقات الحنابلة ٢/٢٥٩"}]}, "tb488": {"name": "مسلم بن الحجاج أبو الحسين القشيري النيسابوري", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٦١", "lines": [{"t": "«أحد الأئمة من حفاظ الأثر، وهو صاحب \"المسند الصحيح\"»؛ رحل إلى العراق والحجاز والشام ومصر، وسمع يحيى بن يحيى وقتيبة وإسحاق بن راهويه وأحمد", "r": "", "m": "طبقات الحنابلة ٢/٤١٣"}, {"t": "رأى أحمد بن سلمة أبا زرعة وأبا حاتم «يقدّمان مسلم بن الحجاج في معرفة الصحيح على مشايخ عصرهما»", "r": "", "m": "طبقات الحنابلة ٢/٤١٣–٤١٤"}, {"t": "قال مسلم: «صنفت هذا \"المسند الصحيح\" من ثلاثمائة ألف حديث مسموعة»", "r": "", "m": "طبقات الحنابلة ٢/٤١٤"}, {"t": "مات عشية الأحد ودفن لخمس بقين من رجب ٢٦١", "r": "", "m": "طبقات الحنابلة ٢/٤١٧"}]}, "tb276": {"name": "أبو زرعة الدمشقي عبد الرحمن بن عمرو بن صفوان النصري", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · ت ٢٨٠", "lines": [{"t": "قال الخلال: «إمام في زمانه، رفيع القدر، حافظ عالم بالحديث والرجال، وصنف من حديث الشام ما لم يصنفه أحد»", "r": "", "m": "طبقات الحنابلة ٢/٧٤"}, {"t": "جمع كتابًا في «التاريخ وعلل الرجال»، «وكان عالمًا بأحمد بن حنبل ويحيى بن معين»، وسمع من أحمد خاصة «مسائل» مشبعة محكمة", "r": "", "m": "طبقات الحنابلة ٢/٧٤"}, {"t": "من مسائله: سأل أحمد عن حديث «أفطر الحاجم والمحجوم» فقال: إليه أذهب، هو صحيح", "r": "", "m": "طبقات الحنابلة ٢/٧٥–٧٦"}, {"t": "توفي سنة ٢٨٠ (ابن المنادي)، وفي تاريخ الخطيب ٢٨١", "r": "", "m": "طبقات الحنابلة ٢/٧٦"}]}, "tb541": {"name": "يعقوب بن إسحاق بن بختان أبو يوسف", "sub": "من الطبقة الأولى (أصحاب أحمد) في «طبقات الحنابلة» · لم تُذكر وفاته", "lines": [{"t": "سمع مسلم بن إبراهيم وأحمد، وروى عنه ابن أبي الدنيا وجعفر الصندلي، «وكان أحد الصالحين الثقات»", "r": "", "m": "طبقات الحنابلة ٢/٥٥٥"}, {"t": "قال ابن أبي الدنيا: «أبو يوسف بن بختان كان من خيار المسلمين»", "r": "", "m": "طبقات الحنابلة ٢/٥٥٥"}, {"t": "قال الخلال: «كان جار أبي عبد الله وصديقه، وروى عن أبي عبد الله \"مسائل\" صالحة كثيرة لم يروها غيره في الورع، و\"مسائل\" صالحة في السلطان»", "r": "", "m": "طبقات الحنابلة ٢/٥٥٥"}, {"t": "لم تُذكر وفاته", "r": "", "m": "طبقات الحنابلة ٢/٥٥٤ (حاشية المحقق function storyStepper(list, key) {
  const n = list.length; state.pst = state.pst || {};
  const k = Math.max(0, Math.min(state.pst[key] || 0, n - 1)), s = list[k];
  return `<div class="progress" aria-hidden="true">${list.map((_, j) => `<span class="${j <= k ? 'on' : ''}"></span>`).join('')}</div>
  <article class="story" aria-live="polite">
    <span class="kicker">${esc(s.k || 'موقف')} · الموقف ${ar(k + 1)} من ${ar(n)}</span>
    ${s.h ? `<h3>${esc(s.h)}</h3>` : ''}
    <p>${esc(s.t)}</p>
    ${s.src ? `<span class="ref">${esc(s.src)}</span>` : ''}
  </article>
  ${n > 1 ? `<div class="row"><button class="btn grow" data-pst="-1" data-pk="${esc(key)}" ${k === 0 ? 'disabled' : ''}>السابق</button><button class="btn primary grow" data-pst="1" data-pk="${esc(key)}" ${k === n - 1 ? 'disabled' : ''}>الموقف التالي</button></div>` : ''}`;
}
function extShow(e, key) {

function extRead() {

const GRP = { list: store.get('ngroups', []) };
const grpName = (id) => { const g = GRP.list.find((x) => x.id === id); return g ? g.name : ''; };
async function grpSave(rec) {
  const { id, ...body } = rec;
  if (NOT.db) { try { await NOT.db.doc('ngroups/' + id).set(body); } catch (e) { state.nmsg = 'تعذّر الحفظ، حاول مرة أخرى.'; render(); return false; } }
  const i = GRP.list.findIndex((x) => x.id === id);
  if (i >= 0) GRP.list[i] = rec; else GRP.list.push(rec);
  if (!NOT.db) store.set('ngroups', GRP.list);
  return true;
}
async function grpDelete(id) {
  const members = NOT.list.filter((t) => t.grp === id);
  for (const t of members) { const r = Object.assign({}, t, { grp: '', updated: Date.now() }); await notSave(r); if (NOT.db) { const k = NOT.list.findIndex((x) => x.id === t.id); if (k >= 0) NOT.list[k] = r; } }
  if (NOT.db) { try { await NOT.db.doc('ngroups/' + id).delete(); } catch (e) { state.nmsg = 'تعذّر الحذف.'; render(); return false; } }
  GRP.list = GRP.list.filter((x) => x.id !== id);
  if (!NOT.db) store.set('ngroups', GRP.list);
  return true;
}

const toEn = (v) => String(v || '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
async function notableSubmit() {
  const f = (k) => { const el = document.querySelector(`[data-nf="${k}"]`); return el ? el.value : ''; };
  const name = f('name').trim();
  if (!name) { state.nmsg = 'اكتب الاسم أولًا.'; render(); return; }
  const died = parseInt(toEn(f('died')), 10);
  const lines = f('lines').split('\n').map((x) => x.trim()).filter(Boolean).map((x) => { const i = x.lastIndexOf('|'); return i > 0 ? { t: x.slice(0, i).trim(), src: x.slice(i + 1).trim() } : { t: x, src: '' }; });
  const id = state.nedit === 'new' ? 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) : state.nedit;
  const old = NOT.list.find((x) => x.id === id);
  const rec = { id, name, madh: f('madh') || 'other', role: f('role').trim(), grp: f('grp') || '', died: isNaN(died) ? null : died, lines, stories: extRead().stories, quote: extRead().quote, created: (old && old.created) || Date.now(), updated: Date.now() };
  state.nmsg = '';
  const ok = await notSave(rec);
  if (ok) {
    if (NOT.db && !NOT.list.find((x) => x.id === id)) NOT.list.push(rec);
    go('notable', { nid: id, nedit: null, ndelask: null });
  }
}

document.addEventListener('input', (e) => {
  if (e.target.id !== 'schq') return;
  const norm = (x) => x.replace(/[ًٌٍَُِّْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
  const q = norm(e.target.value.trim());
  const sec = e.target.closest('section');
  let any = false;
  sec.querySelectorAll('.pills').forEach((ps) => {
    let n = 0;
    ps.querySelectorAll('.pill').forEach((p) => { const b = p.querySelector('b'); const ok = !q || norm(b ? b.textContent : '').includes(q); p.hidden = !ok; if (ok) n++; });
    const box = ps.closest('.cent') || ps.closest('.tier'); if (box) box.hidden = !n;
    if (n) any = true;
  });
  sec.querySelectorAll('.tier').forEach((t) => { t.hidden = ![...t.querySelectorAll('.pill')].some((p) => !p.hidden); });
  document.getElementById('schnone').hidden = any;
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'notq') return;
  const q = e.target.value.trim().replace(/[ًٌٍَُِّْ]/g, '');
  let any = false;
  document.querySelectorAll('.not-group').forEach((sec) => {
    let n = 0;
    sec.querySelectorAll('[data-q]').forEach((b) => { const ok = !q || b.dataset.q.replace(/[ًٌٍَُِّْ]/g, '').includes(q); b.hidden = !ok; if (ok) n++; });
    sec.hidden = !n; if (n) any = true;
  });
  document.getElementById('notnone').hidden = any;
});

function chainSVG() {
  // عُقد السلسلة: الأعلى أقدم
  const N = {
    'أبو حنيفة':     { x: 255, y: 50,  id: 'hanafi' },
    'مالك':          { x: 85,  y: 50,  id: 'maliki' },
    'محمد بن الحسن': { x: 255, y: 140, id: null },
    'الشافعي':       { x: 170, y: 225, id: 'shafii' },
    'أحمد':          { x: 170, y: 305, id: 'hanbali' }
  };
  const w = 120, h = 36;
  const edge = (l) => {
    const a = N[l.from], b = N[l.to];
    if (l.from === 'مالك' && l.to === 'أبو حنيفة') {
      return `<path class="edge" d="M${a.x + w / 2} ${a.y} L${b.x - w / 2 - 6} ${b.y}" marker-end="url(#ah)"/>
              <text class="elbl" x="${(a.x + b.x) / 2}" y="${a.y - 26}" text-anchor="middle">أقران · روى عنه</text>`;
    }
    const x1 = a.x, y1 = a.y + h / 2, x2 = b.x, y2 = b.y - h / 2 - 6;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const short = { 'تلميذه': 'تلميذه', 'أخذ عنه ببغداد ولازمه': 'لازمه ببغداد', 'قرأ عليه الموطأ': 'قرأ الموطأ', 'سمع منه أحمد': 'سمع منه' }[l.lbl] || '';
    return `<path class="edge" d="M${x1} ${y1} C${x1} ${my}, ${x2} ${my}, ${x2} ${y2}" marker-end="url(#ah)"/>
            <text class="elbl" x="${mx + (x1 > x2 ? 10 : -10)}" y="${my}" text-anchor="${x1 > x2 ? 'start' : 'end'}">${short}</text>`;
  };
  return `<div class="svgwrap"><svg class="chain" viewBox="0 0 340 335" role="img" aria-label="مخطط: أبو حنيفة ثم تلميذه محمد بن الحسن ثم الشافعي، ومالك ثم الشافعي، ثم أحمد">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0L10 5L0 10z"/></marker></defs>
    ${LINKS.filter((l) => !l.noEdge).map(edge).join('')}
    ${Object.entries(N).map(([name, p]) => `
      <g>
        <rect class="node" x="${p.x - w / 2}" y="${p.y - h / 2}" width="${w}" height="${h}" rx="18" style="${p.id ? `stroke:${ic(p.id)};stroke-width:1.6` : ''}"/>
        <text class="lbl" x="${p.x}" y="${p.y + 5}" text-anchor="middle">${name}</text>
      </g>`).join('')}
  </svg></div>`;
}

const AR_N = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
const CENT = ['', 'الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع', 'الثامن', 'التاسع', 'العاشر'];
const TIER_T = { 1: ['الطبقة الأولى', 'الآخذون عن الإمام مباشرةً'], 2: ['الطبقة الثانية', 'مَن جاء بعدهم، وأخذ عن أصحابه وتلاميذه'] };
function schPill(t) {
  const dy = t.y ? `ت ${t.yl || AR_N(t.y)} هـ${t.yn ? ' ' + t.yn : ''}` : '';
  return pplPill(Object.assign({}, t, { d: [t.d, dy].filter(Boolean).join(' · ') }));
}
function scholarsHTML(i) {
  const all = i.scholars;
  const groups = [];
  [1, 2].forEach((tr) => {
    const inT = all.filter((t) => t.tier === tr && t.y);
    const noY = all.filter((t) => t.tier === tr && !t.y);
    if (!inT.length && !noY.length) return;
    const cs = [...new Set(inT.map((t) => Math.ceil(t.y / 100)))].sort((a, b) => a - b);
    groups.push(`<div class="tier"><h3>${TIER_T[tr][0]} <small>${TIER_T[tr][1]}</small></h3>${cs.map((c) => `<div class="cent"><h4>القرن ${CENT[c] || AR_N(c)} الهجري</h4><div class="pills">${inT.filter((t) => Math.ceil(t.y / 100) === c).sort((a, b) => a.y - b.y).map(schPill).join('')}</div></div>`).join('')}${noY.length ? `<div class="cent"><h4>لم تُذكر سنة وفاته في مصدره</h4><div class="pills">${noY.map(schPill).join('')}</div></div>` : ''}</div>`);
  });
  const rest = all.filter((t) => !t.tier);
  if (rest.length) groups.push(`<div class="tier"><h3>غير مصنَّف <small>لم تُحدَّد طبقته أو سنة وفاته بعد</small></h3><div class="pills">${rest.map((t) => pplPill(t)).join('')}</div></div>`);
  return `<section class="panel">
    <h2>علماء المذهب</h2>
    ${all.length ? '<input class="search" id="schq" type="search" placeholder="ابحث عن اسم العالم" aria-label="ابحث عن اسم العالم في علماء المذهب">' : ''}

    <p class="muted" style="font-size:13px">من علماء ${i.school} الذين ترجم لهم الذهبي في «السير»، مع موضع كل ترجمة. التصنيف إلى طبقتين بحسب الأخذ عن الإمام مباشرةً أو عمّن بعده، ثم بالقرن الهجري بحسب سنة الوفاة المذكورة في ترجمة كل عالم (وعند الخلاف تُذكر الروايتان).</p>
    ${i.id === 'hanbali' ? '<p class="muted" style="font-size:13px">أُضيف هنا كل مَن وصفه الذهبي في ترجمته من «السير» بأنه حنبلي (١٠٩ أسماء)، وتحت كل اسم وصف الذهبي له، وموضع ترجمته، وسنة وفاته كما في ترجمته. ومَن تحوّل عن المذهب أو انتقل إليه نُبّه عليه. أما مَن ذُكر عَرَضًا في ترجمة غيره فليس هنا. وأُضيفت تراجم من «طبقات الحنابلة» لابن أبي يعلى (ت العثيمين): الطبقة الثانية كاملةً، وأعلام الطبقة الأولى من أصحاب أحمد؛ ويُفتح كل اسم منها على ترجمته موثّقةً بالجزء والصفحة.</p>' : ''}
    ${all.length ? groups.join('') : '<p class="muted">لم تُضف أسماء لهذا المذهب بعد.</p>'}
    ${addBtn('scholars', 'عالم')}
  </section>`;
}

/* ---------- الخريطة ---------- */
const LON0 = 29, LON1 = 64, LAT0 = 13, LAT1 = 39.5, W = 340, H = 290, PAD = 12;
const px = (lon) => PAD + (lon - LON0) / (LON1 - LON0) * (W - 2 * PAD);
const py = (lat) => PAD + (LAT1 - lat) / (LAT1 - LAT0) * (H - 2 * PAD);

const KIND_COLOR = { b: '#2e9e5b', d: '#d64541', s: '#2f7de1' };
function mapSVG(ids) {
  const active = new Set();
  ids.forEach((id) => byId(id).places.forEach((p) => active.add(p.city)));
  let grid = '';
  for (let lon = 30; lon <= 60; lon += 5) grid += `<line class="grid" x1="${px(lon)}" y1="${PAD}" x2="${px(lon)}" y2="${H - PAD}"/><text class="gl" x="${px(lon)}" y="${H - 2}" text-anchor="middle">${ar(lon)}°</text>`;
  for (let lat = 15; lat <= 35; lat += 5) grid += `<line class="grid" x1="${PAD}" y1="${py(lat)}" x2="${W - PAD}" y2="${py(lat)}"/><text class="gl" x="${W - 2}" y="${py(lat) - 2}" text-anchor="end">${ar(lat)}°</text>`;
  const routes = ids.map((id) => {
    const pts = byId(id).places.map((p) => `${px(CITIES[p.city].lon)},${py(CITIES[p.city].lat)}`).join(' ');
    return byId(id).places.length > 1 ? `<polyline points="${pts}" fill="none" stroke="${ic(id)}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" opacity=".9"/>` : '';
  }).join('');
  const cities = Object.entries(CITIES).map(([k, c]) => {
    const on = active.has(k);
    const owners = ids.filter((id) => byId(id).places.some((p) => p.city === k));
    const x = px(c.lon), y = py(c.lat);
    const dots = owners.length
      ? owners.map((id, n) => { const pl = byId(id).places.find((q) => q.city === k); return `<circle cx="${x + (n - (owners.length - 1) / 2) * 9}" cy="${y}" r="5.5" fill="${KIND_COLOR[pl.k] || 'var(--faint)'}" stroke="${ic(id)}" stroke-width="2"/>`; }).join('')
      : `<circle cx="${x}" cy="${y}" r="3" fill="var(--faint)"/>`;
    return `${dots}<text class="city ${on ? '' : 'dim'}" x="${x + c.dx + (c.a === 'start' ? (owners.length - 1) * 3.5 : c.a === 'end' ? -(owners.length - 1) * 3.5 : 0)}" y="${y + c.dy}" text-anchor="${c.a}">${c.n}</text>`;
  }).join('');
  return `<div class="svgwrap"><svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="خريطة تخطيطية لمواضع الأئمة">
    <rect class="base" x="${PAD}" y="${PAD}" width="${W - 2 * PAD}" height="${H - 2 * PAD}" rx="10"/>
    ${grid}${routes}${cities}
  </svg></div>
  <p class="ref">خريطة تخطيطية بخطوط الطول والعرض، والمواضع تقريبية. لون النقطة يدلّ على نوع الموضع، ولون حلقتها على الإمام. يصل الخط بين المواضع بترتيب ذكرها في الترجمة، لا بترتيب زمني مؤكد.</p>`;
}

/* ---------- الخط الزمني ---------- */
function timelineView() {
  const Y0 = 70, Y1 = 250, L = 16, R = 324;
  const x = (y) => R - (y - Y0) / (Y1 - Y0) * (R - L); // من اليمين إلى اليسار
  const rowH = 46, top = 30;
  const ticks = [80, 100, 150, 200, 241].map((t) => `<line class="axis" x1="${x(t)}" y1="${top - 8}" x2="${x(t)}" y2="${top + rowH * 4}"/><text class="tick" x="${x(t)}" y="${top - 12}" text-anchor="middle">${ar(t)}</text>`).join('');
  const bars = IMAMS.map((i, n) => {
    const y = top + n * rowH + 10;
    return `<rect x="${x(i.died)}" y="${y}" width="${x(i.born) - x(i.died)}" height="16" rx="8" fill="${ic(i.id)}"/>
      <text class="nm" x="${x(i.born)}" y="${y - 4}" text-anchor="end">${i.short}</text>
      <text class="yr" x="${x(i.died) - 4}" y="${y + 12}" text-anchor="end">${ar(i.died)}</text>`;
  }).join('');
  const ev = `<line class="ev" x1="${x(179)}" y1="${top - 4}" x2="${x(179)}" y2="${top + rowH * 4 + 4}"/><text class="evt" x="${x(179)}" y="${top + rowH * 4 + 18}" text-anchor="middle">١٧٩ هـ</text>`;
  return `
  <div class="topbar"><button class="icon-btn" data-go="imams" aria-label="رجوع إلى أئمة المذاهب الأربعة">${ICONS.back}</button><div class="title-block"><h1>الخط الزمني</h1><span class="sub">أعمار الأئمة الأربعة بالسنة الهجرية</span></div></div>
  <section class="panel">
    <div class="svgwrap"><svg class="tl" viewBox="0 0 340 ${top + rowH * 4 + 28}" role="img" aria-label="أشرطة أعمار الأئمة من سنة ٨٠ إلى ٢٤١ هجرية">${ticks}${bars}${ev}</svg></div>
    <p class="ref">يُقرأ الخط من اليمين إلى اليسار. الخط المتقطع عند سنة ١٧٩ هـ.</p>
  </section>
  <section class="panel">
    <h2>لحظات التقاء</h2>
    <div class="fact"><span>سنة ١٧٩ هـ مات مالك، وفيها بدأ أحمد طلب العلم وهو ابن خمس عشرة سنة.</span>${REF('٨/١٣٠، ١١/١٨٠')}</div>
    <div class="fact"><span>الشافعي، المولود سنة ١٥٠، حمل الموطأ عن مالك في المدينة وهو ابن نيّف وعشرين.</span>${CITE('١٠/٦–٧', 'طبقات الشافعيين (فصل الرحلة)')}</div>
    <div class="fact"><span>وُلد الشافعي في السنة التي تُوفي فيها أبو حنيفة، سنة ١٥٠ هـ.</span>${CITE('٦/٤٠٣، ١٠/١٠', 'طبقات الشافعيين (فصل المولد)')}</div>
    <div class="fact"><span>قدم الشافعي بغداد أول مرة سنة ١٨٤ هـ بعد موت أبي يوسف بسنتين، واجتمع بأحمد في قدمته سنة ١٩٥ هـ.</span>${CITE('', 'طبقات الشافعيين (فصل الرحلة)، ص ٣٩')}</div>
    <div class="fact"><span>كان أحمد يبكي في زمن محنته، ويتسلّى بضرب أبي حنيفة على القضاء.</span>${CITE('', 'الجواهر ١/٥٦')}</div>
    <div class="fact"><span>سمع أحمد من الشافعي، ثم عاش بعده سبعًا وثلاثين سنة.</span>${REF('١١/١٨١، ١٠/٧٦، ١١/٣٣٤')}</div>
  </section>
  <section class="panel">

/* ---------- من أنا؟ ---------- */
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function newQuiz() { return { order: shuffle(IMAMS.map((i) => i.id)), round: 0, shown: 1, picked: null, score: 0, opts: shuffle(IMAMS.map((i) => i.id)) }; }

function quizView() {
  if (!state.quiz) state.quiz = newQuiz();
  const q = state.quiz;
  if (q.round >= q.order.length) {
    return `
    <div class="topbar"><button class="icon-btn" data-go="imams" aria-label="رجوع إلى أئمة المذاهب الأربعة">${ICONS.back}</button><div class="title-block"><h1>من أنا؟</h1><span class="sub">انتهت الجولة</span></div></div>
    <section class="panel" style="align-items:flex-start">
      <span class="eyebrow">نتيجتك</span>
      <p class="display" style="font-size:40px;line-height:1.2;color:var(--gold)">${ar(q.score)} من ١٢</p>
      <p class="muted">أفضل نتيجة لك: ${ar(state.best)} من ١٢</p>
      <button class="btn primary" data-quiz="again">جولة جديدة</button>
    </section>`;
  }
  const id = q.order[q.round], im = byId(id);
  const answered = q.picked !== null;
  const right = q.picked === id;
  const pts = 4 - q.shown;
  return `
  <div class="row" style="align-items:flex-end;justify-content:space-between">
    <div class="topbar"><button class="icon-btn" data-go="imams" aria-label="رجوع إلى أئمة المذاهب الأربعة">${ICONS.back}</button><div class="title-block"><h1>من أنا؟</h1><span class="sub">السؤال ${ar(q.round + 1)} من ٤ · كلما قلّت التلميحات زادت النقاط</span></div></div>
    <span class="score">${ar(q.score)} نقطة</span>
  </div>
  <section class="panel">
    <div class="hints">
      ${im.hints.map((h, n) => n < q.shown || answered
        ? `<div class="hint"><span>${h.t}</span>${CITE(h.r, h.m)}</div>`
        : `<div class="hint locked">تلميح ${ar(n + 1)} مخفي</div>`).join('')}
    </div>
    ${!answered && q.shown < 3 ? `<button class="btn" data-quiz="hint">أظهر تلميحًا آخر (تنقص النقاط إلى ${ar(pts - 1)})</button>` : ''}
  </section>
  <div class="options" role="group" aria-label="الخيارات">
    ${q.opts.map((o) => {
      let cls = '';
      if (answered && o === id) cls = 'right';
      else if (answered && o === q.picked) cls = 'wrong';
      return `<button class="opt ${cls}" data-pick="${o}" ${answered ? 'disabled' : ''}>${byId(o).short}</button>`;
    }).join('')}
  </div>
  ${answered ? `
  <section class="panel" style="--ic:${ic(id)}">
    <p class="verdict" style="color:${right ? 'var(--teal)' : 'var(--c-shafii)'}">${right ? `أصبت، +${ar(pts)} نقاط` : `الجواب: ${im.name}`}</p>
    <div class="row">
      <button class="btn grow" data-open="${id}">اقرأ ترجمته</button>
      <button class="btn primary grow" data-quiz="next">${q.round === 3 ? 'النتيجة' : 'السؤال التالي'}</button>
    </div>
  </section>` : ''}`;
}

/* ---------- العرض والأحداث ---------- */
function render() {
  const app = document.getElementById('app');
  let html = '';
  if (state.view === 'home') html = homeView();
  else if (state.view === 'imams') html = imamsView();
  else if (state.view === 'imam') html = imamView();
  else if (state.view === 'person') html = personView();
  else if (state.view === 'timeline') html = timelineView();
  else if (state.view === 'map') html = mapView();
  else if (state.view === 'quiz') html = quizView();
  else if (state.view === 'notables') html = state.gedit ? groupForm() : state.nedit ? notableForm() : notablesView();
  else if (state.view === 'notable') html = state.nedit ? notableForm() : notableView();
  else if (state.view === 'settings') html = settingsView();
  app.innerHTML = html;
  const navItems = [['home', 'الرئيسية', ICONS.home], ['settings', 'الإعدادات', ICONS.gear]];
  const cur = state.view === 'settings' ? 'settings' : 'home';
  document.getElementById('nav').innerHTML = navItems.map(([k, l, svg]) =>
    `<button class="nav" data-go="${k}" ${cur === k ? 'aria-current="page"' : ''}>${svg}<span>${l}</span></button>`).join('');
}

function devAction(a, d) {
  if (a === 'on') { state.dev = true; store.set('dev', true); }
  else if (a === 'off') { state.dev = false; store.set('dev', false); state.edit = null; }
  else if (a === 'editp') { state.edit = 'person'; const p = PEOPLE[state.person]; state.draft = JSON.parse(JSON.stringify({ name: p.name, sub: p.sub, lines: p.lines, quote: p.quote || null, note: p.note || '' })); }
  else if (a === 'editi') { const i = byId(state.imam); state.edit = 'imam'; state.draft = { summary: i.summary, sifaT: i.sifa.t, extraT: i.extra.t, quote: i.quote, quoteBy: i.quoteBy }; }
  else if (a === 'addnew') { state.edit = 'new'; state.draft = { role: d.role, name: '', sub: '', d: '', lr: '', lm: '', lines: [{ t: '', r: '', m: '' }], quote: null, note: '' }; }
  else if (a === 'savenew') {
    collect();
    const x = state.draft;
    if (!x.name.trim()) { x.err = 1; render(); return; }
    const id = 'x' + Date.now().toString(36);
    EDITS.added.push({ id, imam: state.imam, role: x.role, n: x.name.trim(), d: x.d.trim(), r: x.lr.trim(), m: x.lm.trim(),
      person: { name: x.name.trim(), sub: x.sub.trim() || (x.role === 'teachers' ? 'من شيوخ ' : x.role === 'scholars' ? 'من علماء ' : 'من تلاميذ ') + byId(state.imam).short, lines: x.lines.filter((l) => l.t.trim()), note: '' } });
    saveEdits(); applyEdits(); state.edit = null; state.draft = null;
  }
  else if (a === 'deladded') {
    EDITS.added = EDITS.added.filter((x) => x.id !== state.person); delete EDITS.people[state.person]; saveEdits(); applyEdits();
    go('imam', { imam: state.imam, tab: state.backTab || 'bio' }); return;
  }
  else if (a === 'editqp') { const q = PEOPLE[state.person].quote || {}; state.edit = 'quote'; state.draft = { qt: q.t || '', qby: q.by || '', qr: q.r || '', qm: q.m || '' }; }
  else if (a === 'editqi') { const i = byId(state.imam); state.edit = 'quotei'; state.draft = { qt: i.quote || '', qby: i.quoteBy || '', qr: i.quoteRef || '', qm: i.quoteM || '' }; }
  else if (a === 'saveq') {
    collect(); const x = state.draft;
    if (state.edit === 'quote') {
      const q = x.qt.trim() ? { t: x.qt.trim(), by: x.qby.trim(), r: x.qr.trim(), m: x.qm.trim() } : null;
      const ad = EDITS.added.find((z) => z.id === state.person);
      if (ad) ad.person.quote = q; else EDITS.people[state.person] = Object.assign({}, EDITS.people[state.person], { quote: q });
    } else {
      EDITS.imams[state.imam] = Object.assign({}, EDITS.imams[state.imam], { quote: x.qt.trim(), quoteBy: x.qby.trim(), quoteRef: x.qr.trim(), quoteM: x.qm.trim() });
    }
    saveEdits(); applyEdits(); state.edit = null; state.draft = null;
  }
  else if (a === 'resetq') {
    if (state.edit === 'quote') {
      const ad = EDITS.added.find((z) => z.id === state.person);
      if (ad) ad.person.quote = null; else if (EDITS.people[state.person]) delete EDITS.people[state.person].quote;
    } else if (EDITS.imams[state.imam]) { ['quote', 'quoteBy', 'quoteRef', 'quoteM'].forEach((k) => delete EDITS.imams[state.imam][k]); }
    saveEdits(); applyEdits(); state.edit = null; state.draft = null;
  }
  else if (a === 'cancel') { state.edit = null; state.draft = null; }
  else if (a === 'addline') { collect(); state.draft.lines.push({ t: '', r: '', m: '' }); }
  else if (a === 'delline') { collect(); state.draft.lines.splice(Number(d.k), 1); }
  else if (a === 'savep') {
    collect();
    const x = state.draft, q = x.quote && x.quote.t && x.quote.t.trim() ? x.quote : null;
    const clean = { name: x.name.trim() || PEOPLE[state.person].name, sub: x.sub, lines: x.lines.filter((l) => l.t.trim()), note: x.note.trim() };
    if (q) { clean.quote = {}; ['t', 'by', 'r', 'm'].forEach((k) => { if (q[k]) clean.quote[k] = q[k]; }); } else clean.quote = null;
    const ad = EDITS.added.find((z) => z.id === state.person);
    if (ad) { ad.person = clean; ad.n = clean.name; } else EDITS.people[state.person] = clean;
    saveEdits(); applyEdits();
    if (!clean.quote) delete PEOPLE[state.person].quote;
    if (!clean.note) delete PEOPLE[state.person].note;
    state.edit = null; state.draft = null;
  }
  else if (a === 'resetp') { delete EDITS.people[state.person]; saveEdits(); applyEdits(); state.edit = null; state.draft = null; }
  else if (a === 'savei') { collect(); EDITS.imams[state.imam] = Object.assign({}, state.draft); saveEdits(); applyEdits(); state.edit = null; state.draft = null; }
  else if (a === 'reseti') { delete EDITS.imams[state.imam]; saveEdits(); applyEdits(); state.edit = null; state.draft = null; }
  else if (a === 'export') { state.devOut = JSON.stringify(EDITS); try { navigator.clipboard.writeText(state.devOut).catch(() => {}); } catch (e) {} }
  else if (a === 'import') {
    const el = document.querySelector('[data-f="io"]');
    try {
      const j = JSON.parse(el.value);
      EDITS = { people: Object.assign({}, EDITS.people, j.people || {}), imams: Object.assign({}, EDITS.imams, j.imams || {}), added: EDITS.added.filter((x) => !(j.added || []).some((y) => y.id === x.id)).concat(j.added || []) };
      saveEdits(); applyEdits(); state.devOut = 'تم الاستيراد.';
    } catch (e) { state.devOut = 'نص غير صالح؛ الصق ناتج «تصدير التعديلات» كما هو.'; }
  }
  else if (a === 'clear') { EDITS = { people: {}, imams: {}, added: [] }; saveEdits(); applyEdits(); state.devOut = ''; }
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.dev) { devAction(d.dev, d); return; }
  if (d.go) go(d.go, d.go === 'imams' ? { imam: null } : {});
  else if (d.person) go('person', { person: d.person, from: state.view === 'notables' ? 'notables' : (state.view === 'person' ? state.from : ''), backTab: state.tab, backY: state.view === 'person' ? state.backY : (window.scrollY || 0) });
  else if (d.backnot) { const y = state.backY || 0; go('notables', { from: '' }); try { window.scrollTo(0, y); } catch (e) {} }
  else if (d.theme) { setTheme(d.theme); render(); }
  else if (d.nnew) { state.nedit = 'new'; state.nmsg = ''; render(); window.scrollTo(0, 0); }
  else if (d.nopen) go('notable', { nid: d.nopen, nedit: null, ndelask: null, nmsg: '' });
  else if (d.nedit) { state.nedit = d.nedit; state.nmsg = ''; render(); window.scrollTo(0, 0); }
  else if (d.ncancel) { state.nedit = null; state.nmsg = ''; render(); }
  else if (d.gnew) { state.gedit = 'new'; state.nmsg = ''; render(); window.scrollTo(0, 0); }
  else if (d.gedit) { state.gedit = d.gedit; state.gdelask = false; state.nmsg = ''; render(); window.scrollTo(0, 0); }
  else if (d.gcancel) { state.gedit = null; state.gdelask = false; state.nmsg = ''; render(); }
  else if (d.gdelask) { state.gdelask = true; render(); }
  else if (d.gdel) { grpDelete(d.gdel).then((ok) => { if (ok) { state.gedit = null; state.gdelask = false; render(); } }); }
  else if (d.gsave) {
    const name = (document.querySelector('[data-gf="name"]').value || '').trim();
    if (!name) { state.nmsg = 'اكتب اسم المجموعة أولًا.'; render(); return; }
    const old = GRP.list.find((x) => x.id === state.gedit);
    const id = old ? old.id : 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    grpSave({ id, name, created: (old && old.created) || Date.now() }).then((ok) => { if (ok) { state.gedit = null; state.nmsg = ''; render(); window.scrollTo(0, 0); } });
  }
  else if (d.sadd) { document.getElementById('stlist').insertAdjacentHTML('beforeend', storyBlock({})); const b = document.querySelectorAll('[data-sb]'); b[b.length - 1].querySelector('[data-sf="h"]').focus(); }
  else if (d.sdel) { t.closest('[data-sb]').remove(); }
  else if (d.pst) { state.pst = state.pst || {}; state.pst[d.pk] = Math.max(0, (state.pst[d.pk] || 0) + Number(d.pst)); render(); }
  else if (d.nsave) notableSubmit();
  else if (d.xedit) { state.xedit = d.xedit; state.nmsg = ''; render(); window.scrollTo(0, 0); }
  else if (d.xcancel) { state.xedit = null; state.nmsg = ''; render(); }
  else if (d.xsave) { const id = state.xedit; extSave(id, extRead()).then((ok) => { if (ok) { state.xedit = null; state.nmsg = ''; render(); window.scrollTo(0, 0); } }); }
  else if (d.ndelask) { state.ndelask = d.ndelask; render(); }
  else if (d.ndel) { notDelete(d.ndel).then((ok) => { if (ok) go('notables', { nid: null, ndelask: null }); }); }
  else if (d.backimam) { const y = state.backY || 0; go('imam', { imam: d.backimam, tab: state.backTab || 'bio', story: 0 }); try { window.scrollTo(0, y); } catch (e) {} }
  else if (d.open) go('imam', { imam: d.open, tab: 'bio', story: 0 });
  else if (d.tab) { state.tab = d.tab; state.story = 0; render(); }
  else if (d.mapf) { state.mapFilter = d.mapf; render(); }
  else if (d.story) { state.story = Math.max(0, state.story + Number(d.story)); render(); }
  else if (d.stamp) { state.stamps[d.stamp] = true; store.set('stamps', state.stamps); go('imams'); }
  else if (d.pick) {
    const q = state.quiz; if (q.picked !== null) return;
    q.picked = d.pick;
    if (d.pick === q.order[q.round]) q.score += 4 - q.shown;
    render();
  }
  else if (d.quiz === 'hint') { state.quiz.shown = Math.min(3, state.quiz.shown + 1); render(); }
  else if (d.quiz === 'next') {
    const q = state.quiz; q.round += 1; q.shown = 1; q.picked = null; q.opts = shuffle(IMAMS.map((i) => i.id));
    if (q.round >= q.order.length && q.score > state.best) { state.best = q.score; store.set('best', state.best); }
    render();
  }
  else if (d.quiz === 'again') { state.quiz = newQuiz(); render(); }
});

render();
</script>
